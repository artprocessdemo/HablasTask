<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f4e8c">
<title>Hablatask</title>
<style>
:root{
  --azul:#1f4e8c;--azul2:#2f6fde;--azul-claro:#e8f0fc;
  --verde:#1e7b34;--verde-claro:#e3f4e6;
  --rojo:#c0392b;--rojo-claro:#fdecea;
  --ambar:#8a5a00;--ambar-claro:#fff4d6;
  --fondo:#f2f4f7;--blanco:#ffffff;--texto:#1a202c;--suave:#5b6577;--borde:#d8dee8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,Roboto,"Segoe UI",Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:15px;display:flex;flex-direction:column}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:18px;font-weight:600}
header small{display:block;font-size:11px;opacity:.75}
header button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px}
#hilo{flex:1;overflow-y:auto;padding:14px 12px 8px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;margin:6px 0;line-height:1.45;word-wrap:break-word}
.app{background:var(--blanco);border:1px solid var(--borde);border-top-left-radius:4px}
.yo{background:var(--verde-claro);color:#14532d;margin-left:auto;border-top-right-radius:4px}
.ok{color:var(--verde);font-weight:600}
.error{background:var(--rojo-claro);color:var(--rojo);border:1px solid #f3c1bb}
.cargando{color:var(--suave);font-style:italic}
.campo{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.campo .ic{width:20px;text-align:center;flex-shrink:0}
.tit{font-weight:600;font-size:16px}
.dictado{color:#9aa3b2;font-size:12px;margin-top:6px;font-style:italic}
.alerta{background:var(--ambar-claro);color:var(--ambar);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.falta{color:var(--rojo);font-size:13px;margin-top:6px}
.botones{display:flex;gap:6px;margin-top:10px}
.botones button{flex:1;padding:10px 4px;border-radius:8px;font-size:14px;border:1px solid var(--borde);background:var(--blanco);color:var(--texto)}
.botones button.p{background:var(--azul2);border-color:var(--azul2);color:#fff;font-weight:600}
.botones button.d{color:var(--rojo);border-color:#f3c1bb}
.botones button:disabled{opacity:.5}
.botones.dos{flex-wrap:wrap}
.botones.dos button{flex:1 1 45%}
.botones button.voz{color:var(--azul2);border-color:var(--azul2)}
.cambio{background:var(--ambar-claro);border-radius:6px;padding-left:4px;padding-right:4px}
.esperando{background:var(--azul-claro);color:var(--azul);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:8px}
.form label{display:block;font-size:12px;color:var(--suave);margin:8px 0 3px}
.form select,.form input{width:100%;padding:8px;border:1px solid var(--borde);border-radius:8px;font-size:15px;background:#fff}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:14px}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px}
.lista div{padding:2px 0;font-size:14px}
footer{background:var(--blanco);border-top:1px solid var(--borde);padding:8px 12px 14px;flex-shrink:0}
#vivo{min-height:20px;font-size:14px;color:var(--suave);text-align:center;margin-bottom:6px;font-style:italic}
.barra{display:flex;align-items:center;gap:10px}
#texto{flex:1;padding:11px 12px;border:1px solid var(--borde);border-radius:22px;font-size:15px}
#mic{width:60px;height:60px;border-radius:50%;border:none;background:var(--azul2);color:#fff;font-size:26px;flex-shrink:0}
#mic.grabando{background:var(--rojo);animation:latido 1.2s infinite}
#enviar{width:44px;height:44px;border-radius:50%;border:1px solid var(--borde);background:#fff;font-size:18px;flex-shrink:0}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#bloqueo{position:fixed;inset:0;background:var(--azul);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
#bloqueo .caja{background:#fff;border-radius:16px;padding:28px 22px;width:100%;max-width:340px;text-align:center}
#bloqueo h2{color:var(--azul);margin-bottom:4px}
#bloqueo p{color:var(--suave);font-size:13px;margin-bottom:16px}
#bloqueo input{width:100%;padding:12px;border:1px solid var(--borde);border-radius:8px;font-size:16px;margin-bottom:10px}
#bloqueo button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--azul2);color:#fff;font-size:16px;font-weight:600}
#bloqueo .err{color:var(--rojo);font-size:13px;min-height:18px;margin-bottom:6px}
</style>
</head>
<body>

<div id="bloqueo">
  <div class="caja">
    <h2>Hablatask</h2>
    <p>Ingrese la clave de acceso. Solo se pide una vez en este teléfono.</p>
    <input id="clave" type="password" placeholder="Clave de acceso" autocomplete="off">
    <div class="err" id="claveErr"></div>
    <button id="entrar">Ingresar</button>
  </div>
</div>

<header>
  <div><h1>Hablatask</h1><small>by Art&amp;Process</small></div>
  <button id="salir">Salir</button>
</header>

<div id="hilo"></div>

<footer>
  <div id="vivo"></div>
  <div class="barra">
    <input id="texto" placeholder="Escriba o toque el micrófono" autocomplete="off">
    <button id="enviar" aria-label="Enviar texto">➤</button>
    <button id="mic" aria-label="Dictar">🎤</button>
  </div>
</footer>

<script>
/* ═════════ CONFIGURACIÓN ═════════ */
const API = 'https://script.google.com/macros/s/AKfycbwZibBJO3oWwlaKW8u-TFYGirdOpcDrfqPy1uvMYpKCUClFmcXNoCC530I-iVLKzp4y/exec';
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ICONOS = {'Exhibición':'🏠','Entrega':'🔑','Visita técnica':'🔧','Inicio de reparación':'🛠️','Reunión':'👥','Firma de contrato':'✍️'};

let CLAVE = null;
let CAT = { tipos: [], propiedades: [], personas: [] };

/* ═════════ UTILIDADES ═════════ */
// localStorage puede fallar (modo privado); la app funciona igual sin él
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// "2026-10-26" → "lunes 26 de octubre" (sin pasar por zonas horarias)
function fechaLarga(f){
  if(!f) return '—';
  const [y,m,d] = f.split('-').map(Number);
  return DIAS[new Date(y, m-1, d).getDay()] + ' ' + d + ' de ' + MESES[m-1];
}
function horaFin(h, min){
  if(!h) return '';
  const [a,b] = h.split(':').map(Number);
  const t = a*60 + b + Number(min || 0);
  return String(Math.floor(t/60) % 24).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0');
}

/* ═════════ API ═════════ */
// text/plain evita la verificación previa (CORS) que Apps Script no responde
async function api(accion, datos){
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ clave: CLAVE, accion: accion, datos: datos || {} })
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Error desconocido');
  return j;
}

/* ═════════ CONVERSACIÓN ═════════ */
const hilo = document.getElementById('hilo');
function burbuja(html, quien, clase){
  const d = document.createElement('div');
  d.className = 'msg ' + (quien === 'yo' ? 'yo' : 'app') + (clase ? ' ' + clase : '');
  d.innerHTML = html;
  hilo.appendChild(d);
  hilo.scrollTop = hilo.scrollHeight;
  return d;
}
function bajar(){ hilo.scrollTop = hilo.scrollHeight; }

/* ═════════ INGRESO ═════════ */
async function iniciar(){
  const r = await api('resumen');
  CAT = r.catalogos || CAT;
  const h = new Date().getHours();
  const saludo = h < 12 ? 'Buenos días' : (h < 20 ? 'Buenas tardes' : 'Buenas noches');
  let html = '<div>' + saludo + '. Hoy es <b>' + fechaLarga(r.fecha) + '</b>.</div>';
  if(r.eventos.length){
    html += '<div style="margin-top:6px">Tiene ' + r.eventos.length + (r.eventos.length === 1 ? ' evento' : ' eventos') + ':</div><div class="lista">';
    r.eventos.forEach(function(e){
      html += '<div>' + (ICONOS[e.tipo] || '📌') + ' ' + esc(e.hora) + ' · ' + esc(e.tipo) + (e.propiedad ? ' · ' + esc(e.propiedad) : '') + '</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="margin-top:6px">No tiene eventos para hoy.</div>';
  }
  html += '<div style="margin-top:6px;color:var(--suave);font-size:13px">Toque el micrófono para agendar o cancelar.</div>';
  burbuja(html, 'app');
}

document.getElementById('entrar').onclick = async function(){
  const v = document.getElementById('clave').value.trim();
  const err = document.getElementById('claveErr');
  if(!v){ err.textContent = 'Ingrese la clave.'; return; }
  err.textContent = 'Verificando…';
  CLAVE = v;
  try{
    await iniciar();
    lsSet('hablatask_clave', v);
    document.getElementById('bloqueo').style.display = 'none';
    err.textContent = '';
  }catch(e){
    CLAVE = null;
    err.textContent = /clave/i.test(e.message) ? 'Clave incorrecta.' : 'No se pudo conectar: ' + e.message;
  }
};
document.getElementById('clave').addEventListener('keydown', function(e){ if(e.key === 'Enter') document.getElementById('entrar').click(); });

document.getElementById('salir').onclick = function(){
  lsDel('hablatask_clave'); CLAVE = null; hilo.innerHTML = '';
  document.getElementById('clave').value = '';
  document.getElementById('bloqueo').style.display = 'flex';
};

/* ═════════ DESTINO DEL DICTADO ═════════ */
// Si hay una "Edición por voz" pendiente, el siguiente dictado (o texto escrito) va a esa tarjeta.
// Si no, se trata como un evento nuevo o una cancelación.
let edicionPendiente = null;

function enviarTexto(t){
  t = (t || '').trim();
  if(!t) return;
  if(edicionPendiente){
    const f = edicionPendiente;
    edicionPendiente = null;
    campoTexto.placeholder = 'Escriba o toque el micrófono';
    f(t);
  } else {
    procesar(t);
  }
}

/* ═════════ PROCESAR DICTADO ═════════ */
async function procesar(texto){
  texto = texto.trim();
  if(!texto) return;
  burbuja(esc(texto), 'yo');
  // La intención la decide una regla simple, no la IA
  const modo = /^\s*(cancel|anul|elimin|borr)/i.test(texto) ? 'cancelar' : 'agendar';
  const b = burbuja('Interpretando…', 'app', 'cargando');
  try{
    const r = await api('interpretar', { texto: texto, modo: modo });
    b.classList.remove('cargando');
    if(r.modo === 'cancelar') tarjetaCancelar(b, r, texto);
    else tarjetaAgendar(b, r);
  }catch(e){
    b.className = 'msg app error';
    b.textContent = 'No pude procesar el dictado. ' + e.message;
  }
}

/* ═════════ TARJETA: AGENDAR ═════════ */
function tarjetaAgendar(b, r){
  const ev = r.evento;
  let alertas = r.alertas || [];
  let editando = false;
  let ocupado = false;
  let cambios = {};          // campos modificados por la última edición por voz (se resaltan)
  let esperandoVoz = false;  // true mientras la tarjeta espera el dictado de la corrección

  const marca = function(c){ return cambios[c] ? ' class="cambio"' : ''; };

  function faltantes(){
    const f = [];
    if(!ev.tipo || ev.tipo === 'Sin clasificar') f.push('tipo');
    if(!ev.fecha) f.push('fecha');
    if(!ev.hora) f.push('hora');
    return f;
  }

  function dibujar(msgFalta){
    let h = '';
    if(!editando){
      h += '<div class="campo tit"><span class="ic">' + (ICONOS[ev.tipo] || '❓') + '</span><span' + marca('tipo') + '>' + esc(ev.tipo || 'Sin clasificar') + '</span></div>';
      h += '<div class="campo"><span class="ic">📅</span><span' + marca('fecha') + '>' + (ev.fecha ? fechaLarga(ev.fecha) : 'Sin fecha') + (ev.hora ? ' · ' + esc(ev.hora) + ' a ' + horaFin(ev.hora, ev.duracion) : ' · Sin hora') + '</span></div>';
      h += '<div class="campo"><span class="ic">📍</span><span' + marca('propiedad') + '>' + (ev.propiedad ? esc(ev.propiedad) + (ev.id_propiedad ? '<br><small style="color:var(--suave)">' + esc(ev.direccion) + '</small>' : ' <small style="color:var(--ambar)">(no registrada)</small>') : 'Sin propiedad') + '</span></div>';
      h += '<div class="campo"><span class="ic">👤</span><span' + marca('persona') + '>' + (ev.persona ? esc(ev.persona) + (ev.id_persona ? (ev.rol ? ' · ' + esc(ev.rol) : '') : ' <small style="color:var(--ambar)">(no registrada)</small>') : 'Sin persona') + '</span></div>';
      if(ev.notas) h += '<div class="campo"><span class="ic">📝</span><span' + marca('notas') + '>' + esc(ev.notas) + '</span></div>';
      alertas.forEach(function(a){ h += '<div class="alerta">⚠️ ' + esc(a) + '</div>'; });
      if(msgFalta) h += '<div class="falta">' + esc(msgFalta) + '</div>';
      if(Object.keys(cambios).length) h += '<div style="font-size:12px;color:var(--ambar);margin-top:6px">Resaltado: lo que cambió con la edición por voz.</div>';
      if(esperandoVoz) h += '<div class="esperando">🎤 Toque el micrófono y diga la corrección. Ej.: "agrega la casa Montemar y a Daniela Pizarro".</div>';
      h += '<div class="dictado">"' + esc(ev.texto) + '"</div>';
      h += '<div class="botones dos"><button class="p" data-a="agendar">Agendar</button><button class="voz" data-a="voz">' + (esperandoVoz ? 'Cancelar edición' : 'Edición por voz') + '</button><button data-a="editar">Editar</button><button class="d" data-a="descartar">Descartar</button></div>';
    } else {
      h += '<div class="form">';
      h += '<label>Tipo</label><select data-c="tipo"><option value="">Elegir…</option>' + CAT.tipos.map(function(t){ return '<option' + (t.tipo === ev.tipo ? ' selected' : '') + '>' + esc(t.tipo) + '</option>'; }).join('') + '</select>';
      h += '<label>Fecha</label><input type="date" data-c="fecha" value="' + (ev.fecha || '') + '">';
      h += '<label>Hora</label><input type="time" data-c="hora" value="' + (ev.hora || '') + '">';
      h += '<label>Propiedad</label><select data-c="propiedad"><option value="">Sin propiedad</option>' + (!ev.id_propiedad && ev.propiedad ? '<option value="__libre" selected>' + esc(ev.propiedad) + ' (no registrada)</option>' : '') + CAT.propiedades.map(function(p){ return '<option value="' + p.id + '"' + (p.id === ev.id_propiedad ? ' selected' : '') + '>' + esc(p.alias) + '</option>'; }).join('') + '</select>';
      h += '<label>Persona</label><select data-c="persona"><option value="">Sin persona</option>' + (!ev.id_persona && ev.persona ? '<option value="__libre" selected>' + esc(ev.persona) + ' (no registrada)</option>' : '') + CAT.personas.map(function(p){ return '<option value="' + p.id + '"' + (p.id === ev.id_persona ? ' selected' : '') + '>' + esc(p.nombre) + ' · ' + esc(p.rol) + '</option>'; }).join('') + '</select>';
      h += '</div><div class="botones"><button class="p" data-a="listo">Listo</button></div>';
    }
    b.innerHTML = h;
    b.querySelectorAll('button[data-a]').forEach(function(btn){ btn.onclick = function(){ accion(btn.dataset.a); }; });
    bajar();
  }

  function leerFormulario(){
    const v = function(c){ return b.querySelector('[data-c="' + c + '"]').value; };
    const tipo = v('tipo');
    const t = CAT.tipos.find(function(x){ return x.tipo === tipo; });
    ev.tipo = tipo || 'Sin clasificar';
    ev.duracion = t ? t.duracion : ev.duracion;
    ev.fecha = v('fecha') || null;
    ev.hora = v('hora') || null;
    // "__libre" conserva la propiedad o persona no registrada que se dictó
    if(v('propiedad') !== '__libre'){
      const p = CAT.propiedades.find(function(x){ return x.id === v('propiedad'); });
      ev.id_propiedad = p ? p.id : null; ev.propiedad = p ? p.alias : null; ev.direccion = p ? p.direccion : null;
    }
    if(v('persona') !== '__libre'){
      const q = CAT.personas.find(function(x){ return x.id === v('persona'); });
      ev.id_persona = q ? q.id : null; ev.persona = q ? q.nombre : null; ev.rol = q ? q.rol : null;
    }
    // Tras editar, las alertas originales pueden ya no aplicar; se quitan las que el usuario resolvió
    alertas = alertas.filter(function(a){ return /Choca/.test(a); });
  }

  // Recibe la corrección dictada, la envía al servidor y actualiza la tarjeta resaltando los cambios
  async function edicionPorVoz(texto){
    esperandoVoz = false;
    burbuja('✏️ ' + esc(texto), 'yo');
    ocupado = true;
    b.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
    const aviso = burbuja('Aplicando la edición…', 'app', 'cargando');
    try{
      const res = await api('corregir', { evento: ev, texto: texto });
      const nuevo = res.evento;
      cambios = {};
      if(nuevo.tipo !== ev.tipo) cambios.tipo = 1;
      if(nuevo.fecha !== ev.fecha || nuevo.hora !== ev.hora) cambios.fecha = 1;
      if((nuevo.propiedad || '') !== (ev.propiedad || '')) cambios.propiedad = 1;
      if((nuevo.persona || '') !== (ev.persona || '')) cambios.persona = 1;
      if((nuevo.notas || '') !== (ev.notas || '')) cambios.notas = 1;
      Object.assign(ev, nuevo);
      alertas = res.alertas || [];
      aviso.remove();
      ocupado = false;
      // La tarjeta se mueve al final de la conversación para que quede a la vista
      hilo.appendChild(b);
      dibujar(Object.keys(cambios).length ? '' : 'No se detectaron cambios. Intente de nuevo o use Editar.');
    }catch(e){
      aviso.className = 'msg app error';
      aviso.textContent = 'No se pudo aplicar la edición. ' + e.message;
      ocupado = false;
      dibujar();
    }
  }

  async function accion(a){
    if(ocupado) return;
    if(a === 'voz'){
      if(esperandoVoz){
        esperandoVoz = false;
        edicionPendiente = null;
        campoTexto.placeholder = 'Escriba o toque el micrófono';
      } else {
        esperandoVoz = true;
        edicionPendiente = edicionPorVoz;
        campoTexto.placeholder = 'Diga o escriba la corrección';
      }
      dibujar();
      return;
    }
    // Cualquier otra acción cancela una edición por voz que haya quedado pendiente
    if(esperandoVoz){ esperandoVoz = false; edicionPendiente = null; campoTexto.placeholder = 'Escriba o toque el micrófono'; }
    if(a === 'editar'){ editando = true; dibujar(); return; }
    if(a === 'listo'){ leerFormulario(); cambios = {}; editando = false; dibujar(); return; }
    if(a === 'descartar'){
      b.innerHTML = '<span style="color:var(--suave)">Descartado. Puede volver a dictar.</span>';
      return;
    }
    if(a === 'agendar'){
      const f = faltantes();
      if(f.length){ dibujar('Falta: ' + f.join(', ') + '. Use Editar para completarlo.'); return; }
      ocupado = true;
      b.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
      try{
        await api('crear', { evento: ev });
        b.innerHTML = '<span class="ok">✓ Agendado:</span> ' + esc(ev.tipo) + ', ' + fechaLarga(ev.fecha) + ' a las ' + esc(ev.hora) +
          (ev.propiedad ? ', ' + esc(ev.propiedad) : '') + '.<br><small style="color:var(--suave)">Con 5 recordatorios en su calendario.</small>';
      }catch(e){
        ocupado = false;
        dibujar('No se pudo agendar: ' + e.message);
      }
    }
  }

  dibujar();
}

/* ═════════ TARJETA: CANCELAR ═════════ */
function tarjetaCancelar(b, r, texto){
  const alertas = (r.alertas || []).map(function(a){ return '<div class="alerta">⚠️ ' + esc(a) + '</div>'; }).join('');
  if(!r.fecha){ b.innerHTML = 'No identifiqué la fecha a cancelar. Dicte por ejemplo: "cancelar los eventos del martes 27".' + alertas; return; }
  if(!r.eventos.length){ b.innerHTML = 'No hay eventos activos el <b>' + fechaLarga(r.fecha) + '</b>.' + alertas; return; }

  function elegir(msg){
    let h = 'El <b>' + fechaLarga(r.fecha) + '</b> tiene ' + r.eventos.length + (r.eventos.length === 1 ? ' evento' : ' eventos') + '. Elija cuáles cancelar:' + alertas;
    r.eventos.forEach(function(e){
      h += '<label class="chk"><input type="checkbox" value="' + esc(e.id) + '"><span>' + (ICONOS[e.tipo] || '📌') + ' ' + esc(e.hora) + ' · ' + esc(e.tipo) +
        (e.propiedad ? ' · ' + esc(e.propiedad) : '') + (e.persona ? '<br><small style="color:var(--suave)">' + esc(e.persona) + '</small>' : '') + '</span></label>';
    });
    if(msg) h += '<div class="falta">' + esc(msg) + '</div>';
    h += '<div class="botones"><button class="d" data-a="seguir">Cancelar seleccionados</button><button data-a="volver">Volver</button></div>';
    b.innerHTML = h;
    b.querySelector('[data-a="seguir"]').onclick = function(){
      const ids = Array.from(b.querySelectorAll('input:checked')).map(function(x){ return x.value; });
      if(!ids.length){ elegir('Seleccione al menos un evento.'); return; }
      confirmar(ids);
    };
    b.querySelector('[data-a="volver"]').onclick = function(){ b.innerHTML = '<span style="color:var(--suave)">Sin cambios.</span>'; };
    bajar();
  }

  // Segunda confirmación: muestra exactamente qué se cancelará
  function confirmar(ids){
    const sel = r.eventos.filter(function(e){ return ids.indexOf(e.id) !== -1; });
    let h = 'Se cancelará' + (sel.length > 1 ? 'n ' + sel.length + ' eventos' : ' 1 evento') + ':<div class="lista" style="margin:6px 0">';
    sel.forEach(function(e){ h += '<div>• ' + esc(e.hora) + ' ' + esc(e.tipo) + (e.propiedad ? ' · ' + esc(e.propiedad) : '') + '</div>'; });
    h += '</div><div class="botones"><button class="d" data-a="ok">Confirmar</button><button data-a="no">Volver</button></div>';
    b.innerHTML = h;
    b.querySelector('[data-a="no"]').onclick = function(){ elegir(); };
    b.querySelector('[data-a="ok"]').onclick = async function(){
      b.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
      try{
        const res = await api('cancelar', { ids: ids, motivo: 'Cancelado por voz: ' + texto });
        b.innerHTML = '<span class="ok">✓ Cancelado:</span> ' + res.cancelados.length + (res.cancelados.length === 1 ? ' evento' : ' eventos') + ' del ' + fechaLarga(r.fecha) + '.';
      }catch(e){
        b.innerHTML = '<span style="color:var(--rojo)">No se pudo cancelar: ' + esc(e.message) + '</span>';
      }
    };
    bajar();
  }

  elegir();
}

/* ═════════ MICRÓFONO ═════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const btnMic = document.getElementById('mic');
const vivo = document.getElementById('vivo');
let rec = null;
let escuchando = false;     // true mientras la usuaria no toque "terminar"
let base = '';              // texto ya confirmado de sesiones anteriores (antes de una pausa)
let sesion = '';            // texto de la sesión de reconocimiento actual
let limite = null;          // temporizador de seguridad (60 s)

function norm(s){ return s.toLowerCase().replace(/\s+/g, ' ').trim(); }

// Une los resultados sin duplicar: Android repite la frase completa en cada actualización.
// Si un resultado nuevo empieza con el anterior, lo reemplaza; si es distinto, lo agrega.
function unirResultados(results){
  const segs = [];
  for(let i = 0; i < results.length; i++){
    const t = results[i][0].transcript.trim();
    if(!t) continue;
    const ult = segs[segs.length - 1];
    if(ult && norm(t).indexOf(norm(ult)) === 0) segs[segs.length - 1] = t;
    else if(ult && norm(ult).indexOf(norm(t)) === 0) continue;
    else segs.push(t);
  }
  return segs.join(' ');
}

function textoActual(){ return (base + ' ' + sesion).trim(); }

function iniciarSesion(){
  rec = new SR();
  rec.lang = 'es-CL';
  rec.continuous = true;
  rec.interimResults = true;
  sesion = '';
  rec.onresult = function(e){
    sesion = unirResultados(e.results);
    vivo.textContent = textoActual() || 'Escuchando…';
  };
  rec.onerror = function(e){
    if(e.error === 'not-allowed'){
      escuchando = false;
      burbuja('El micrófono está bloqueado. Actívelo en el candado junto a la dirección → Permisos → Micrófono.', 'app', 'error');
    } else if(e.error !== 'no-speech' && e.error !== 'aborted'){
      burbuja('Error del micrófono: ' + esc(e.error), 'app', 'error');
    }
  };
  rec.onend = function(){
    // Android corta la escucha tras un silencio: si ella no ha terminado, se reinicia y se conserva lo dicho
    base = textoActual();
    sesion = '';
    if(escuchando){
      try{ iniciarSesion(); return; }catch(err){ /* si no se puede reiniciar, se termina normalmente */ }
    }
    terminar();
  };
  rec.start();
}

function terminar(){
  escuchando = false;
  clearTimeout(limite);
  btnMic.classList.remove('grabando');
  btnMic.textContent = '🎤';
  const t = base.trim();
  base = ''; sesion = '';
  vivo.textContent = '';
  if(t) enviarTexto(t);
}

btnMic.onclick = function(){
  if(!SR){ burbuja('Este navegador no permite dictado. Use Chrome o escriba el evento.', 'app', 'error'); return; }
  if(escuchando){
    // Ella decide cuándo termina: se envía de inmediato lo que ya está en pantalla,
    // sin esperar el cierre de Android (que tarda 1 a 2 segundos)
    escuchando = false;
    base = textoActual();
    sesion = '';
    if(rec){ rec.onend = null; rec.onresult = null; try{ rec.abort(); }catch(err){} }
    terminar();
    return;
  }
  base = ''; sesion = '';
  escuchando = true;
  btnMic.classList.add('grabando');
  btnMic.textContent = '■';
  vivo.textContent = 'Escuchando… puede hacer pausas. Toque de nuevo para terminar.';
  // Límite de seguridad por si olvida tocar el botón
  limite = setTimeout(function(){ if(escuchando) btnMic.onclick(); }, 60000);
  iniciarSesion();
};

/* ═════════ ESCRIBIR (respaldo si falla el micrófono) ═════════ */
const campoTexto = document.getElementById('texto');
document.getElementById('enviar').onclick = function(){ const t = campoTexto.value; campoTexto.value = ''; enviarTexto(t); };
campoTexto.addEventListener('keydown', function(e){ if(e.key === 'Enter') document.getElementById('enviar').click(); });

/* ═════════ ARRANQUE ═════════ */
(async function(){
  const guardada = lsGet('hablatask_clave');
  if(!guardada){ document.getElementById('clave').focus(); return; }
  CLAVE = guardada;
  try{
    await iniciar();
    document.getElementById('bloqueo').style.display = 'none';
  }catch(e){
    CLAVE = null;
    if(/clave/i.test(e.message)) lsDel('hablatask_clave');
    document.getElementById('claveErr').textContent = /clave/i.test(e.message) ? 'La clave guardada ya no es válida.' : 'No se pudo conectar: ' + e.message;
  }
})();
</script>
